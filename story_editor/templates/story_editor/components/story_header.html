<section class="story-header">
  <h2 class="story-title">{{ story.title }}</h2>
  <div class="story-meta">
    <span class="story-author" aria-label="Story author">By {{ story.author }}</span>
    <span class="story-status status-{{ story.status }}" aria-label="Publication status">{{ story.status|title }}</span>
  </div>
</section>
